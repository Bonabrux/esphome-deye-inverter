      uint16_t raw = (uint16_t)id(time_of_use_1_soc_raw).state;
      return (raw >> 8) & 0x00FF;
    # WRITE: Keep the Low Byte intact and overwrite the High Byte
    set_action:
      - number.set:
          id: time_of_use_1_soc_raw
          value: !lambda |-
            uint16_t raw = (uint16_t)id(time_of_use_1_soc_raw).state;
            uint16_t low_byte = raw & 0x00FF;
            return low_byte | ((uint16_t)x << 8);

