  # ==========================================
  # TIME OF USE 1 (Address 268)
  # ==========================================
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Time of Use 1 SoC RAW"
    id: time_of_use_1_soc_raw
    register_type: holding
    address: 268
    value_type: U_WORD
    internal: true

  - platform: template
    name: "Time of Use 1 Grid SoC"
    id: time_of_use_1_soc
    unit_of_measurement: "%"
    device_class: battery
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    icon: "mdi:battery-clock"
    # READ: Isolate the Low Byte to get the Grid SoC
    lambda: |-
      if (isnan(id(time_of_use_1_soc_raw).state)) return {};
      uint16_t raw = (uint16_t)id(time_of_use_1_soc_raw).state;
      return raw & 0x00FF;
    # WRITE: Keep the High Byte intact and overwrite the Low Byte
    set_action:
      - number.set:
          id: time_of_use_1_soc_raw
          value: !lambda |-
            uint16_t raw = (uint16_t)id(time_of_use_1_soc_raw).state;
            uint16_t high_byte = raw & 0xFF00;
            return high_byte | (uint16_t)x;

